<semantic-search>
  <semantic-search-query-keyword  domain='<http://www.researchspace.org/ontology/EX_Digital_Image>'
                                  placeholder="Input IIIF Manifest"
                                  min-search-term-length=7
                                  tokenize-lucene-query=false
                                  escape-lucene-syntax=false
                                  debounce=500
                                  query='PREFIX iiif: <https://w3id.org/dsanno/platform/services/iiif/>
                                  SELECT DISTINCT ?subject ?proxied_manifest ?manifestversion ?canvasid ?canvaslabel ?imageservice ?apiversion ?level ?quality ?importable ?blockedreason ?verified WHERE {
                                    ?subject iiif:manifest ?__token__ ;
                                      iiif:proxied_manifest ?proxied_manifest;
                                      iiif:manifestversion ?manifestversion;
                                      iiif:canvasid ?canvasid;
                                      iiif:label ?canvaslabel;
                                      iiif:imageservice ?imageservice;
                                      iiif:apiversion ?apiversion;
                                      iiif:level ?level;
                                      iiif:quality ?quality;
                                      iiif:importable ?importable;
                                      iiif:blockedreason ?blockedreason;
                                      iiif:verified ?verified.
                                    }'
  ></semantic-search-query-keyword>

  <semantic-search-result-holder>
    <div style="margin-top: 25px;">
      <semantic-search-result>
        <div class="wikipediaResultsTable">
          <semantic-context repository='iiif-canvas-extraction'>
            <semantic-table id='semantic-search-result-table'
                            query='SELECT DISTINCT ?subject ?proxied_manifest ?manifestversion ?canvasid ?canvaslabel ?imageservice ?apiversion ?level ?quality ?importable ?blockedreason ?verified WHERE {
                                    BIND(?subject as ?iri) .
                                  } ORDER BY ?subject'

                            options='{"showFilter":true, "resultsPerPage":6}'
                            column-configuration='[
                                    {"displayName": "IIIF Canvas ID", "cellTemplate": "{{> canvasId}}" },
                                    {"displayName": "IIIF Canvas Label", "cellTemplate": "{{> canvasLabel}}" },
                                    {"displayName": "Image", "cellTemplate": "{{> images}}"},
                                    {"displayName": "Actions", "cellTemplate": "{{> actions}}" }
                                  ]'
            >

              <template id='canvasId'>
                <div>{{canvasid.value}}</div>
              </template>

              <template id='canvasLabel'>
                <div>{{canvaslabel.value}}</div>
              </template>

              <template id='images'>
                <div>
                  {{#if imageservice.value}}
                    <img src="{{imageservice.value}}/full/250,/0/{{quality.value}}.jpg"
                         width="auto" height="180" style="max-width: 15vw; object-fit: contain;">
                  {{/if}}
                </div>
              </template>

              <template id='actions'>
                <div>
                    <mp-event-trigger id='{{viewId}}-select-api-resource-trigger'
                                      type='apiResourceSelect'
                                      data='{"apiResourceName": "{{canvaslabel.value}}",
                                             "apiResourceIIIFManifest": "{{proxied_manifest.value}}",
                                             "apiResourceIIIFCanvasId": "{{canvasid.value}}",
                                             "apiResourceIIIFImageService": "{{imageservice.value}}",
                                            {{#if scheme}}"scheme": "{{scheme}}",{{/if}}
                                             "viewId": "{{viewId}}"
                                            }' >
                      {{#if blockedreason.value}}
                        <button disabled class="btn btn-action" title="{{blockedreason.value}}">{{blockedreason.value}}</button>
                      {{else}}
                        {{#ifCond verified.value "==" "true"}}
                          <button class="btn btn-action" title="Image API {{apiversion.value}}, {{level.value}}">Import image</button>
                        {{else}}
                          <button class="btn btn-action" title="{{level.value}} claimed by the manifest, the service was not verified">Import image (unverified)</button>
                        {{/ifCond}}
                      {{/if}}
                    </mp-event-trigger>
                </div>
              </template>

            </semantic-table>
          </semantic-context>
        </div>
      </semantic-search-result>
    </div>
  </semantic-search-result-holder>

</semantic-search>
